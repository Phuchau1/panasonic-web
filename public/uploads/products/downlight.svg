<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="light-beam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </radialGradient>
    <filter id="dl-sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#f8fafc"/>
  <!-- Downlight circular bezel -->
  <circle cx="200" cy="180" r="120" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" filter="url(#dl-sh)"/>
  <!-- Heatsink tabs -->
  <rect x="65" y="170" width="15" height="20" rx="3" fill="#f97316"/>
  <rect x="320" y="170" width="15" height="20" rx="3" fill="#f97316"/>
  <!-- Diffuser Ring -->
  <circle cx="200" cy="180" r="95" fill="url(#light-beam)" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="200" cy="180" r="85" fill="#fef9c3" opacity="0.6"/>
  <text x="200" y="380" font-family="sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">ĐÈN LED DOWNLIGHT ÂM TRẦN 9W</text>
</svg>
