<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#f8fafc"/>
  <!-- Switch Frame 86x86 mm -->
  <rect x="50" y="50" width="300" height="300" rx="16" fill="url(#metal)" filter="url(#shadow)"/>
  <!-- Metallic Border Highlight -->
  <rect x="52" y="52" width="296" height="296" rx="14" fill="none" stroke="#64748b" stroke-width="2"/>
  <!-- Switch Key (Moderva style) -->
  <rect x="75" y="75" width="250" height="250" rx="8" fill="#334155"/>
  <line x1="200" y1="85" x2="200" y2="315" stroke="#1e293b" stroke-width="2"/>
  <!-- LED indicator slit -->
  <rect x="198" y="275" width="4" height="20" rx="2" fill="#38bdf8"/>
  <text x="200" y="380" font-family="sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">PANASONIC MODERVA (METALLIC GREY)</text>
</svg>
