<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="mcb-sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#f8fafc"/>
  <!-- MCB 2P Body 36mm DIN rail -->
  <rect x="120" y="60" width="160" height="280" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" filter="url(#mcb-sh)"/>
  <!-- Top Terminals -->
  <rect x="135" y="70" width="50" height="30" rx="4" fill="#94a3b8"/>
  <rect x="215" y="70" width="50" height="30" rx="4" fill="#94a3b8"/>
  <!-- Center Plate -->
  <rect x="130" y="115" width="140" height="170" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- Status Window -->
  <rect x="155" y="130" width="25" height="12" rx="2" fill="#dc2626"/>
  <rect x="220" y="130" width="25" height="12" rx="2" fill="#dc2626"/>
  <!-- Toggle Lever (2P Bridge) -->
  <rect x="160" y="175" width="80" height="45" rx="6" fill="#1e293b"/>
  <rect x="170" y="190" width="60" height="8" rx="2" fill="#475569"/>
  <!-- Spec Text -->
  <text x="200" y="245" font-family="sans-serif" font-size="12" font-weight="800" fill="#004098" text-anchor="middle">Panasonic</text>
  <text x="200" y="260" font-family="monospace" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">C16 6000A</text>
  <!-- Bottom Terminals -->
  <rect x="135" y="300" width="50" height="30" rx="4" fill="#94a3b8"/>
  <rect x="215" y="300" width="50" height="30" rx="4" fill="#94a3b8"/>
  <text x="200" y="380" font-family="sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">PANASONIC MCB 2P 16A 6kA (BBD2161CNV)</text>
</svg>
