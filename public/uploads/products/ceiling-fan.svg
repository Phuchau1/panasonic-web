<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="fan-sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#f8fafc"/>
  <!-- Ceiling Fan 5 blades -->
  <g transform="translate(200, 180)" filter="url(#fan-sh)">
    <!-- 5 Blades -->
    <path d="M0,0 L25,-120 Q30,-140 0,-150 Q-30,-140 -25,-120 Z" fill="#334155" transform="rotate(0)"/>
    <path d="M0,0 L25,-120 Q30,-140 0,-150 Q-30,-140 -25,-120 Z" fill="#334155" transform="rotate(72)"/>
    <path d="M0,0 L25,-120 Q30,-140 0,-150 Q-30,-140 -25,-120 Z" fill="#334155" transform="rotate(144)"/>
    <path d="M0,0 L25,-120 Q30,-140 0,-150 Q-30,-140 -25,-120 Z" fill="#334155" transform="rotate(216)"/>
    <path d="M0,0 L25,-120 Q30,-140 0,-150 Q-30,-140 -25,-120 Z" fill="#334155" transform="rotate(288)"/>
    <!-- Motor Center -->
    <circle cx="0" cy="0" r="45" fill="#1e293b" stroke="#475569" stroke-width="4"/>
    <circle cx="0" cy="0" r="25" fill="#f8fafc"/>
    <text x="0" y="4" font-family="sans-serif" font-size="7" font-weight="800" fill="#004098" text-anchor="middle">Panasonic</text>
  </g>
  <text x="200" y="380" font-family="sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">QUẠT TRẦN 5 CÁNH DC INVERTER (F-60UFN)</text>
</svg>
